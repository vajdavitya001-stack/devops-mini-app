name: End-to-End CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: 1. Automatizált Tesztelés (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tesztek futtatása
        run: pytest -v

  build:
    name: 2. Artifact Buildelése (Docker)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Docker Image buildelése
        run: docker build -t devops-mini-app:${{ github.sha }} .

  deploy:
    name: 3. Telepítés Sandbox Környezetbe (CD)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy indítása webhookon keresztül
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"